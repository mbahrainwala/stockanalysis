spring:
  application:
    name: stock-tracker
  profiles:
    active: h2
  thymeleaf:
    cache: false
  web:
    resources:
      chain:
        # Fingerprint static asset URLs so a changed app.js is never served from browser cache.
        strategy:
          content:
            enabled: true
            paths: /**
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: 8080
  servlet:
    session:
      # Cookie-only sessions: URL rewriting appends ;jsessionid=... to redirects,
      # which misses the "/" mapping and renders index without a model.
      tracking-modes: cookie
