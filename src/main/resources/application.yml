spring:
  application:
    name: stock-tracker
  profiles:
    active: h2
  thymeleaf:
    cache: false
  web:
    resources:
      chain:
        # Fingerprint static asset URLs so a changed app.js is never served from browser cache.
        strategy:
          content:
            enabled: true
            paths: /**
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: 8080
  servlet:
    session:
      # Cookie-only sessions: URL rewriting appends ;jsessionid=... to redirects,
      # which misses the "/" mapping and renders index without a model.
      tracking-modes: cookie

app:
  admin:
    # Used only to create the first admin user when no users exist yet. Change the password
    # after logging in for the first time.
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}

ai:
  context:
    # Size of the model's context window, in tokens. Prompts are built to fit inside it.
    window-tokens: 200000
    # Tokens kept free for the model's reply.
    output-reserve-tokens: 16000
    # Upper limit for the market data added to an analysis, so local models aren't fed a huge prompt.
    brief-max-tokens: 60000
