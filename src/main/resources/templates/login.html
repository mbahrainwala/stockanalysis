<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${companyName}">Stock Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-page">
    <section class="card login-card">
        <h1 class="login-title" th:text="${companyName}">Stock Tracker</h1>
        <p class="muted small-note">Sign in to see your accounts and speculation list.</p>
        <div class="alert alert-error" th:if="${error}">Incorrect username or password.</div>
        <div class="alert alert-success" th:if="${loggedOut}">You've been signed out.</div>
        <form th:action="@{/login}" method="post" class="form-grid">
            <label>
                Username
                <input type="text" name="username" required autofocus autocomplete="username">
            </label>
            <label>
                Password
                <input type="password" name="password" required autocomplete="current-password">
            </label>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>
        <p class="muted small-note">New accounts are created by an administrator.</p>
    </section>
</div>
</body>
</html>
